<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>طلبات البيت</title>
  <meta name="description" content="قايمة طلبات البيت: من الشارع وأونلاين">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="طلبات البيت">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" data-icon="basket"></span>
      <div>
        <h1>طلبات البيت</h1>
        <span id="conn" class="conn" data-state="off" role="status" aria-live="polite">مش متصل</span>
      </div>
    </div>
    <button id="resetAll" class="btn ghost" type="button" title="رجّع كل حاجة زي الأول">رجّع الأصل</button>
    <button id="clearAll" class="btn danger" type="button"><span data-icon="trash"></span>امسح الكل</button>
  </header>

  <main>
    <!-- المختار: يمين = الشارع، شمال = أونلاين -->
    <section class="board">
      <div class="zone street" data-zone="street">
        <div class="zone-head"><span class="zone-title"><span data-icon="store"></span>من الشارع</span><span class="count" id="countStreet"></span></div>
        <ul class="list" id="listStreet"></ul>
      </div>
      <div class="zone online" data-zone="online">
        <div class="zone-head"><span class="zone-title"><span data-icon="cart"></span>أونلاين</span><span class="count" id="countOnline"></span></div>
        <ul class="list" id="listOnline"></ul>
      </div>
    </section>

    <!-- كل المنتجات: شريط كاتيجوريز + منتجات الكاتيجوري المفتوحة -->
    <section class="pool" id="pool" data-zone="pool">
      <form id="addForm" class="add" autocomplete="off">
        <label class="search">
          <span class="search-ic" data-icon="search"></span>
          <input id="q" type="search" maxlength="60" placeholder="ابحث أو اكتب منتج جديد…" enterkeyhint="done" aria-label="ابحث أو أضف منتج">
        </label>
        <button class="btn" type="submit">إضافة</button>
        <button id="editToggle" class="btn ghost" type="button" aria-label="تعديل المنتجات" title="تعديل (مسح منتجات)"><span data-icon="pencil"></span></button>
      </form>
      <nav id="tabs" class="tabs" aria-label="الكاتيجوريز"></nav>
      <div id="products" class="products"></div>
    </section>
  </main>

  <!-- اختيار الكاتيجوري لما تضيف منتج جديد -->
  <dialog id="catPicker" class="sheet">
    <form method="dialog">
      <h3>«<span id="newName"></span>» يتحط فين؟</h3>
      <div id="catGrid" class="cat-grid"></div>
      <button class="btn ghost wide" value="cancel">إلغاء</button>
    </form>
  </dialog>

  <!-- نافذة التأكيد -->
  <dialog id="confirm" class="sheet confirm" aria-labelledby="cfTitle" aria-describedby="cfText">
    <div class="cf-icon" id="cfIcon"></div>
    <h3 id="cfTitle"></h3>
    <p id="cfText"></p>
    <div class="cf-actions">
      <button id="cfNo" class="btn ghost" type="button">إلغاء</button>
      <button id="cfYes" class="btn danger-solid" type="button"></button>
    </div>
  </dialog>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
